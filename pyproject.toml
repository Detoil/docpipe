[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docpipe"
version = "0.1.0"
description = "Generic document pipeline: triage folders of documents and extract structured facts using the Gemini Batch API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "google-genai>=1.0",
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook]>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
docpipe = "docpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
